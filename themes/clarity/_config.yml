# ============================================================
#  Clarity —— 一脉相承于 Apple 设计语言的 Hexo 主题
#  本文件是主题默认值。如需覆盖，请在站点根目录新建 _config.clarity.yml
# ============================================================

# ---------- 站点标识 ----------
brand:
  # 是否显示左上角的品牌区（图形标记 + 名字）
  show: true
  # 导航栏左侧显示的名字，留空则使用站点 title
  name:
  # 图形标记：geom（几何渐变方块）| image（使用下面的图片）
  mark: geom
  mark_image:

# ---------- 导航菜单 ----------
# "名称: 路径"，路径用 /archives/ 这种形式
menu:
  主页: /
  文档: /archives/
  分类: /categories/
  标签: /tags/
  关于: /about/

# ---------- 强调色 ----------
accent: '#0071e3'
accent_dark: '#0a84ff'

# ---------- 首页 ----------
home:
  # 首屏标语，留空使用站点 subtitle
  slogan:
  # 首屏描述，留空使用站点 description
  intro:
  # 精选大卡：自动取最新一篇文章，并在下方列表中排除
  featured: true
  # 列表摘要字数
  excerpt_length: 96
  # 列表每篇最多显示几个标签
  max_tags: 3

# ---------- 文章页 ----------
post:
  # 右侧目录
  toc: true
  # 字数统计
  word_count: true
  # 预估阅读时长
  reading_time: true
  # 显示"更新于"
  updated: true
  # 文末作者卡片
  author_card: true
  # 文章顶部显示所属分类（那个小标签）
  show_category: true
  # 作者头像：填图片路径就用图片；留空则用作者名首字生成圆形色块
  author_avatar: ''
  # 上下篇导航
  nav: true
  # 版权声明
  copyright: false
  # 过期提醒
  outdated:
    enable: false
    days: 180

# ---------- 代码块 ----------
code:
  # 一键复制按钮
  copy: true
  # 显示语言标签
  lang: true
  # 显示行号（需同时开启 Hexo 的 highlight.line_number）
  line_number: false

# ---------- 图片 ----------
lightbox: true

# ---------- 页脚 ----------
footer:
  since: 2025
  # 显示文章总数
  statistics: true
  # 显示 "Powered by"
  powered: true

# ---------- 外观 ----------
appearance:
  # auto | light | dark
  default: auto
  # 是否在导航栏显示明暗切换按钮
  switch: true

# ---------- 动效 ----------
# 关闭后所有进入动画立即呈现（也自动尊重 prefers-reduced-motion）
motion: true
# 锚点平滑滚动
smooth_scroll: true

# ---------- 首屏封面 ----------
cover:
  # 只在首页显示；向下滚动即进入正文
  enable: true
  image: /images/cover.jpg
  # 图片上的大标题，留空用站点 title
  title:
  # 图片上的副标题，留空用 home.slogan / 站点 subtitle
  subtitle:
  # 遮罩浓度 0–1：越大文字越清晰、图片越暗
  overlay: 0.42
  # 纵向取景位置 0–1（0 顶部 / 1 底部）
  position: 0.45
  # 横向取景位置，百分比（0 最左 / 50 居中 / 100 最右）
  # 手机竖屏时图片是按高度铺满的，左右会被裁掉一大半，靠这个调人物入镜
  position_x: 50
  # 底部的"向下滚动"提示
  hint: true
  # 是否显示标题上方的那行小字（副标题 / 站点 subtitle）
  show_eyebrow: true
  # 是否显示标题下方的描述段
  show_lede: true
  # 标题字体：留空用系统无衬线；brush 用自带的毛笔字体（钟齐志莽行书）
  title_font: ''

# ---------- 左侧个人栏 ----------
profile:
  enable: true
  avatar: /images/avatar.jpg
  # 留空用 config.author
  name:
  # 名字下面的一行小字
  tagline:
  # 简介
  bio:
  # 链接列表，写成 "名称: 地址"
  links:
    GitHub: https://github.com/liuziqiang520btt-cmyk
    文档: /archives/
    关于: /about/
  # 显示"文章数 · 分类数"
  stats: true
  # 粘性定位：滚动时保持在视口内
  sticky: true
